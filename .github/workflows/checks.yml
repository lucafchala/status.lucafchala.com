name: checks
on:
  push:
  pull_request:
  # Toda semana também: tests/contrato.test.mjs confere o que este painel lê
  # contra o contrato do healthz que o FOTOS publica, e o fotos pode mudar o
  # contrato sem ninguém tocar neste repositório.
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          set -e
          find . -name '*.json' -not -path '*/node_modules/*' -not -path './.git/*' | while read -r f; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done

      - name: Forbid weak HTML escapers (must also escape quotes)
        run: |
          if grep -rnE --include='*.html' --include='*.js' --exclude-dir=node_modules --exclude-dir=.git "replace\(/>/g, ?'&gt;'\) *[;)]" .; then
            echo "Found a 3-char HTML escaper - use the canonical 5-char version that also escapes quotes"
            exit 1
          fi

      - name: Security headers file present
        run: test -f _headers

      - name: Function behaviour tests
        # Executor embutido do Node — este repositório não tem package.json e
        # não precisa ganhar um para ter teste. Cobre os controles que falham em
        # silêncio: CSRF e trava por IP no /api/subscribe, o GET do
        # /api/unsubscribe que não pode mais apagar ninguém, e o escape da
        # página que mostra o endereço de quem cancelou.
        # tests/contrato.test.mjs baixa docs/healthz-contrato.json do fotos
        # (repositório público) e reprova se status.js ler um campo que o
        # contrato não tem, ou se o número do contrato mudou.
        run: node --test tests/*.test.mjs

      - name: No inline scripts or handlers (CSP is script-src 'self')
        run: |
          python3 - <<'PY'
          import re, glob, sys
          bad = []
          for p in glob.glob('*.html'):
              html = open(p, encoding='utf-8').read()
              for m in re.finditer(r'<script\b([^>]*)>(.*?)</script>', html, re.S):
                  if 'src=' not in m.group(1) and m.group(2).strip(): bad.append(f'{p}: inline <script>')
                  if 'src=' in m.group(1) and 'data-cfasync="false"' not in m.group(1): bad.append(f'{p}: <script> without data-cfasync="false" (Rocket Loader)')
              bad += [f'{p}: inline handler {h}' for h in re.findall(r'\s(on[a-z]+)=', html)]
          if bad: print('\n'.join(bad)); sys.exit(1)
          print('No inline scripts or handlers; every script opts out of Rocket Loader.')
          PY

      - name: Status-monitor marker present
        run: grep -q 'monitoramento de serviços' index.html || { echo "SERVICES → Status looks for 'monitoramento de serviços' on this page"; exit 1; }

      - name: JS module syntax check (functions)
        run: |
          node -e '
            const files = process.argv.slice(1);
            (async () => {
              for (const f of files) {
                try { await import(process.cwd() + "/" + f); console.log("OK", f); }
                catch (e) {
                  if (e instanceof SyntaxError) { console.error("SYNTAX FAIL", f, e.message); process.exit(1); }
                  console.log("OK (runtime-only error)", f);
                }
              }
            })();
          ' $(find functions -name "*.js")
