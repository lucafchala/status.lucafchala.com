name: monitor

# O vigia do agendador — e o agendador de reserva.
#
# Quem varre é o agendador da Cloudflare (agendador/, Cron Trigger a cada
# 10 min). Este workflow mora fora da Cloudflare de propósito: é o único
# observador que sobrevive a um problema na conta. Ele lê a idade do retrato
# (/api/retrato, que não varre nada) e:
#   • com o agendador em dia, não faz mais nada;
#   • com o agendador parado há mais de 30 min, pede uma varredura de socorro
#     e FALHA — o GitHub manda e-mail ao dono quando um workflow agendado
#     falha, e esse é o alarme do alarme;
#   • sem o agendador implantado (ou sem STATUS_DB), é ele o agendador, como
#     sempre foi.
# A lógica está em scripts/vigia.mjs, com teste em tests/agendador.test.mjs.
#
# O cron do GitHub NÃO é pontual: em setembro de 2026, agendado a cada 10 min,
# rodou 5 a 8 vezes por dia (#38). Como vigia isso basta; como agendador,
# nunca bastou. Minutos fora da virada da hora, que é quando a fila do GitHub
# está mais cheia.
on:
  schedule:
    - cron: '4-59/10 * * * *'
  workflow_dispatch: {}     # botão manual na aba Actions

# `actions: write` só para o keep-alive abaixo.
permissions:
  actions: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Vigiar o agendador (e varrer se ele não estiver varrendo)
        run: node scripts/vigia.mjs

      # Keep-alive: em repositório público, o GitHub desliga o `schedule`
      # depois de 60 dias sem atividade, sem avisar. Reabilitar o próprio
      # workflow pela API a cada execução é o que as ações de keep-alive
      # conhecidas fazem sem criar commit (um commit aqui seria um deploy do
      # Pages). Best-effort: a garantia de verdade é o agendador da Cloudflare,
      # que não tem esse limite.
      - name: Keep-alive do schedule
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/actions/workflows/monitor.yml/enable")
          echo "enable: HTTP $code"
