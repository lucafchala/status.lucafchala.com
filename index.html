<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Status — lucafchala.com</title>
  <meta name="theme-color" content="#0d0c0a" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Status dos serviços do ecossistema lucafchala.com" />
  <link rel="canonical" href="https://status.lucafchala.com/" />
  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-latin-wght-normal.18be452724.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/cormorant-garamond-latin-wght-normal.d80df8ff5a.woff2" crossorigin />
  <link rel="stylesheet" href="/app.css" />
  <script src="/tema.js"></script>
</head>
<body>

<div class="controls">
  <div class="controls-inner">
    <button class="ctrl-btn" id="btn-theme" type="button" data-action="tema">light</button>
    <span class="ctrl-sep">·</span>
    <a href="https://lucafchala.com" class="ctrl-btn ctrl-link">home</a>
  </div>
</div>

<div class="wrap">
  <header>
    <h1 class="name">Status<br /><em>lucafchala.com</em></h1>
    <p class="micro">monitoramento de serviços</p>
  </header>

  <div class="banner" id="banner">
    <div class="status-dot checking" id="banner-dot"></div>
    <span class="banner-text" id="banner-text">Verificando serviços…</span>
    <span class="banner-sub" id="banner-sub"></span>
  </div>

  <div class="rule section-anim">serviços</div>
  <div class="services section-anim" id="services-list"></div>

  <div class="rule section-anim-2">terceiros</div>
  <div class="services section-anim-2" id="third-party-list"></div>

  <!-- Hidden until the log has something to show: an empty section is noise. -->
  <div id="history-section" hidden>
    <div class="rule section-anim-2">histórico · 48h</div>
    <div class="panel section-anim-2" id="history-panel"></div>
  </div>

  <!-- Hidden until there are samples: uma tabela de "—" sugeriria que a
       latência está sendo observada quando ainda não há série nenhuma. -->
  <div id="latency-section" hidden>
    <div class="rule section-anim-2">tempo de resposta · 48h</div>
    <div class="panel section-anim-2" id="latency-panel"></div>
  </div>

  <!-- Hidden unless CF_API_TOKEN/CF_ACCOUNT_ID are configured. -->
  <div id="quota-section" hidden>
    <div class="rule section-anim-2">cotas do plano gratuito</div>
    <div class="panel section-anim-2" id="quota-panel"></div>
  </div>

  <div class="refresh-row">
    <span class="last-checked" id="last-checked">–</span>
    <button class="act-btn" id="btn-refresh" type="button" data-action="atualizar">↻ atualizar</button>
  </div>

  <div class="subscribe-wrap" id="subscribe-wrap">
    <div id="sub-idle">
      <button class="act-btn" type="button" data-action="inscrever-abrir">+ receber alertas por email</button>
    </div>
    <div id="sub-form" hidden>
      <input type="email" id="sub-email" class="sub-input" placeholder="seu@email.com" aria-label="seu e-mail" />
      <button class="act-btn ok" type="button" data-action="inscrever" id="sub-ok-btn">ok</button>
      <button class="act-btn" type="button" data-action="inscrever-fechar" aria-label="cancelar">×</button>
    </div>
    <div id="sub-done" hidden>
      <span class="micro">alertas ativados ✓</span>
    </div>
    <div id="sub-already" hidden>
      <span class="micro">email já inscrito ✓</span>
    </div>
    <div id="sub-error" hidden>
      <span class="micro erro" id="sub-error-msg">erro — tente novamente</span>
    </div>
  </div>

  <footer>
    <a href="https://lucafchala.com">lucafchala.com</a>
    &nbsp;·&nbsp;
    <a href="mailto:suporte@lucafchala.com">suporte@lucafchala.com</a>
  </footer>
</div>

<script src="/app.js" defer></script>
</body>
</html>
